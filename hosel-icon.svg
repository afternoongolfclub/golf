<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hosel Charts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2e3e"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- sleeve ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#384a5d" stroke-width="14"/>

  <!-- the other eleven settings -->
  <circle cx="331.0" cy="126.1" r="14" fill="#63788f"/>
  <circle cx="385.9" cy="181.0" r="14" fill="#63788f"/>
  <circle cx="406.0" cy="256.0" r="19" fill="#9db0c6"/>
  <circle cx="385.9" cy="331.0" r="14" fill="#63788f"/>
  <circle cx="331.0" cy="385.9" r="14" fill="#63788f"/>
  <circle cx="256.0" cy="406.0" r="19" fill="#9db0c6"/>
  <circle cx="181.0" cy="385.9" r="14" fill="#63788f"/>
  <circle cx="126.1" cy="331.0" r="14" fill="#63788f"/>
  <circle cx="106.0" cy="256.0" r="19" fill="#9db0c6"/>
  <circle cx="126.1" cy="181.0" r="14" fill="#63788f"/>
  <circle cx="181.0" cy="126.1" r="14" fill="#63788f"/>

  <!-- pointer from the hub to the setting you are in -->
  <line x1="256" y1="256" x2="256" y2="136" stroke="#43c463" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="106" r="34" fill="#43c463" stroke="#0f1720" stroke-width="9"/>
  <circle cx="256" cy="256" r="36" fill="#17212b" stroke="#43c463" stroke-width="14"/>
</svg>
