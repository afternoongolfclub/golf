# Static site: everything is served straight from the repo root, no build step.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long cache for the icons, which change rarely and are content-named.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep the HTML fresh so a deploy shows up straight away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# The charts used to live at /hosel.html; keep the old links working.
[[redirects]]
  from = "/hosel"
  to = "/"
  status = 301

[[redirects]]
  from = "/hosel.html"
  to = "/"
  status = 301
